<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Переход к оплате...</title>
    <script>
        var mightyPlanUrl = "https://teora.mn.co/plans/2001046?bundle_token=1921a940bddf1b4b1f1768bcc578d9de&utm_source=manual";

        // Промокод: pay.teora.live/<план>/?promo_code=КОД — передаём его в Mighty,
        // чтобы скидка подставилась на странице оплаты. Без кода всё как раньше.
        (function () {
            var m = /[?&]promo_code=([^&#]+)/i.exec(window.location.search);
            if (!m) return;
            var code = decodeURIComponent(m[1]).trim().toUpperCase();
            if (/^[A-Z0-9_-]{1,40}$/.test(code)) {
                mightyPlanUrl += (mightyPlanUrl.indexOf('?') >= 0 ? '&' : '?') + 'promo_code=' + encodeURIComponent(code);
            }
        })();

        window.onload = function() {
            var link = document.querySelector('.loader-box a');
            if (link) link.href = mightyPlanUrl;

            var win = window.open(mightyPlanUrl, '_system');

            if (!win) {
                window.location.href = mightyPlanUrl;
            }
        };
    </script>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; }
        .loader-box { text-align: center; color: #333; }
        a { color: #0066cc; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="loader-box">
        <h2>Перенаправляем на безопасную страницу оплаты...</h2>
        <p>Если страница не открылась автоматически, <a href="https://teora.mn.co/plans/2001046?bundle_token=1921a940bddf1b4b1f1768bcc578d9de&utm_source=manual">нажмите здесь</a>.</p>
    </div>
</body>
</html>
